<a href="#" class="js-fh5co-nav-toggle fh5co-nav-toggle" aria-label="Toggle navigation"><i></i></a>
<aside id="fh5co-aside" role="complementary" class="border js-fullheight">

	<h1 id="fh5co-logo"><a href="{{ '/index.html' | relative_url }}">{{ site.title }}</a></h1>
	<h3 id="fh5co-sublogo">{{ site.tagline }}</h3>

	<nav id="fh5co-main-menu" role="navigation" aria-label="Main navigation">
		<ul>
			{%- for item in site.data.nav %}
			<li{% if page.active == item.key %} class="fh5co-active"{% endif %}><a href="{{ item.url | relative_url }}"{% if page.active == item.key %} aria-current="page"{% endif %}>{{ item.title }}</a></li>
			{%- endfor %}
		</ul>
	</nav>

	<div class="fh5co-footer">
		<p><small>&copy; All Rights Reserved.</small></p>
		<ul>
			{%- for link in site.data.social %}
			<li><a href="{{ link.url }}" target="_blank" rel="noopener" aria-label="{{ link.name }}"><i class="{{ link.icon }}"></i></a></li>
			{%- endfor %}
		</ul>
	</div>

</aside>
