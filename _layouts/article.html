---
layout: default
---

<nav class="page-outline article-outline" aria-label="Article outline" hidden>
	<span class="page-outline__track" aria-hidden="true"></span>
	<span class="page-outline__fill" aria-hidden="true"></span>
	<ol></ol>
</nav>

<div id="fh5co-main">
	<article class="article">
		<header class="article-masthead" id="article-top">
			<a class="article-back" href="{{ '/blog.html' | relative_url }}">{% include icon.html name="arrow-left" %} Back to blog</a>
			<p class="article-kicker">{{ page.kicker }}</p>
			<h1>{{ page.heading | default: page.title }}</h1>
			{%- if page.deck %}
			<p class="article-deck">{{ page.deck }}</p>
			{%- endif %}
		</header>

		<div class="article-body">
			{{ content }}
		</div>
	</article>

	<dialog class="article-image-modal" aria-label="Image preview">
		<div class="article-image-modal__surface">
			<button class="article-image-modal__close" type="button" aria-label="Close image preview" data-article-image-close>Close</button>
			<img class="article-image-modal__image" alt="">
		</div>
	</dialog>
</div>

<script src="{{ '/js/article-outline.js' | relative_url }}?v={{ site.asset_version }}"></script>
<script src="{{ '/js/article-images.js' | relative_url }}?v={{ site.asset_version }}"></script>
