<!DOCTYPE html>
<html class="no-js" lang="en">

<head>
	<!-- Replaces Modernizr, which was loaded solely for this class swap (see `.js .animate-box`). -->
	<script>document.documentElement.className = document.documentElement.className.replace(/\bno-js\b/, 'js');</script>
	{%- include head.html %}
</head>

<body{% if page.active == 'home' %} class="page-home"{% endif %}>
	<div id="fh5co-page">
		{%- include sidebar.html %}

		{{ content }}
	</div>

	<script src="{{ '/js/jquery.min.js' | relative_url }}"></script>
	<script src="{{ '/js/jquery.waypoints.min.js' | relative_url }}"></script>
	<script src="{{ '/js/main.js' | relative_url }}?v={{ site.asset_version }}"></script>
	{%- for script in page.extra_js %}
	<script src="{{ script | relative_url }}?v={{ site.asset_version }}"></script>
	{%- endfor %}
</body>

</html>
